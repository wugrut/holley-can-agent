# =============================================================================
# EFI Intelligence Copilot — Tuning Laptop Configuration
# Designed for Holley Terminator X / Terminator X MAX CAN Bus
# =============================================================================

# CAN Hardware Interface Settings
can:
  # Interface type options for Windows tuning laptops:
  #   - 'holley'  : Official Holley USB-to-CAN Cable (558-443 via pre-installed Holley WinUSB driver)
  #   - 'pcan'    : PEAK-System PCAN-USB (Requires PCAN-Basic driver)
  #   - 'slcan'   : CANable / CANable Pro in SLCAN mode (Requires COM port)
  #   - 'simulator': Offline virtual simulator (no hardware needed)
  interface: holley

  # Channel:
  #   - For Holley : 'HOLLEY_USBCAN_0'
  #   - For PCAN   : 'PCAN_USBBUS1' (Channel 1)
  #   - For CANable: 'COM3', 'COM4', etc. (Check Windows Device Manager)
  #   - For Linux  : 'can0'
  channel: HOLLEY_USBCAN_0

  # Holley HEFI Broadcast Standard Bitrate: 1 Mbit/s (1,000,000 bps)
  bitrate: 1000000

  # Mask to isolate 29-bit broadcast channel index and strip ECU serial
  id_mask: 0x1FFFF800

  # Listen-only safety setting: NEVER transmit or acknowledge frames on vehicle bus
  receive_own_messages: false

# Vehicle Specification Context (1980 Ford Fairmont Turbo 4.8L LS + 4L80E)
vehicle:
  name: "1980 Ford Fairmont 4-Door Boxtop (Turbo 4.8L LS)"
  engine: "4.8L Gen III LS (Sloppy Stage 2 + VS Racing 78/75)"
  transmission: "GM 4L80E (Yank 3600 Stall + 3rd-Gear Sloppy Transbrake)"
  rear_axle_ratio: 3.73
  tire_diameter_in: 25.85
  ecu_type: "Terminator X MAX"
  target_base_fuel_pressure_psi: 58.0   # Racetronix 420 LPH + 1:1 boost-referenced @ 58 PSI base
  injectors_lb_hr: 80.0                 # Siemens Deka 80 lb/hr high-impedance
  standard_boost_range_psi: [12.0, 15.0]
  pump_blend_boost_cut_psi: 17.0        # > 17.0 PSI hard safety cut on lower ethanol blends
  max_e85_boost_psi: 20.0               # 20.0 PSI strictly on high-percentage E85
  min_ve_learn_coolant_f: 160.0
  coolant_warning_f: 220.0
  low_voltage_v: 13.0
  max_rpm: 6800

# Persistence & Report Storage Paths
storage:
  database: ./data/copilot_sessions.db
  reports_dir: ./reports

# Web Dashboard & Live Telemetry Settings
api:
  host: 127.0.0.1
  port: 8420

dashboard:
  title: "Terminator X MAX — EFI Copilot"
  update_rate_ms: 50    # 20 Hz push to browser gauges
