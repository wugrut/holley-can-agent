<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Holley Terminator X Max — Live Dashboard</title>
    <meta name="description" content="Real-time ECU monitoring dashboard for Holley Terminator X Max via CAN bus">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Status Bar -->
    <header id="status-bar">
        <div class="status-left">
            <div class="logo">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                <span class="logo-text">HOLLEY CAN AGENT</span>
            </div>
            <div id="connection-status" class="status-pill disconnected">
                <span class="status-dot"></span>
                <span class="status-text">DISCONNECTED</span>
            </div>
        </div>
        <div class="status-right">
            <div id="ecu-info" class="ecu-info">ECU: —</div>
            <div id="fps-counter" class="fps-counter">0 FPS</div>
            <div id="clock" class="clock"></div>
        </div>
    </header>

    <!-- Alert Banner -->
    <div id="alert-banner" class="alert-banner hidden">
        <div class="alert-icon">⚠</div>
        <div id="alert-message" class="alert-message"></div>
        <button id="alert-dismiss" class="alert-dismiss" aria-label="Dismiss alert">✕</button>
    </div>

    <!-- Main Gauge Grid -->
    <main id="gauge-grid">
        <!-- RPM — Full-width arc gauge -->
        <div class="gauge-card gauge-rpm" id="gauge-card-rpm">
            <div class="gauge-header">
                <span class="gauge-label">RPM</span>
                <span class="gauge-unit">rev/min</span>
            </div>
            <div class="gauge-body">
                <canvas id="gauge-rpm" width="480" height="260"></canvas>
                <div class="gauge-value-overlay">
                    <span id="value-rpm" class="gauge-value-large">0</span>
                </div>
            </div>
        </div>

        <!-- MAP / Boost -->
        <div class="gauge-card" id="gauge-card-map">
            <div class="gauge-header">
                <span class="gauge-label">BOOST / VAC</span>
                <span class="gauge-unit" id="map-unit">kPa</span>
            </div>
            <div class="gauge-body">
                <canvas id="gauge-map" width="240" height="240"></canvas>
                <div class="gauge-value-overlay">
                    <span id="value-map" class="gauge-value-medium">0.0</span>
                    <span id="value-map-secondary" class="gauge-value-secondary">101.3 kPa</span>
                </div>
            </div>
        </div>

        <!-- AFR with target overlay -->
        <div class="gauge-card" id="gauge-card-afr">
            <div class="gauge-header">
                <span class="gauge-label">AFR</span>
                <span class="gauge-unit">Air-Fuel Ratio</span>
            </div>
            <div class="gauge-body">
                <canvas id="gauge-afr" width="240" height="240"></canvas>
                <div class="gauge-value-overlay">
                    <span id="value-afr" class="gauge-value-medium">14.7</span>
                    <span id="value-afr-target" class="gauge-value-secondary">Target: 14.7</span>
                </div>
            </div>
        </div>

        <!-- Ignition Timing -->
        <div class="gauge-card" id="gauge-card-timing">
            <div class="gauge-header">
                <span class="gauge-label">TIMING</span>
                <span class="gauge-unit">°BTDC</span>
            </div>
            <div class="gauge-body">
                <canvas id="gauge-timing" width="240" height="240"></canvas>
                <div class="gauge-value-overlay">
                    <span id="value-timing" class="gauge-value-medium">0.0</span>
                </div>
            </div>
        </div>

        <!-- Coolant Temp -->
        <div class="gauge-card" id="gauge-card-coolant">
            <div class="gauge-header">
                <span class="gauge-label">COOLANT</span>
                <span class="gauge-unit">°F</span>
            </div>
            <div class="gauge-body gauge-body-bar">
                <div class="bar-gauge-container">
                    <div id="bar-coolant" class="bar-gauge-fill"></div>
                    <div class="bar-gauge-markers">
                        <span>100</span><span>160</span><span>220</span><span>260</span>
                    </div>
                </div>
                <span id="value-coolant" class="gauge-value-medium bar-value">185</span>
            </div>
        </div>

        <!-- Battery Voltage -->
        <div class="gauge-card" id="gauge-card-battery">
            <div class="gauge-header">
                <span class="gauge-label">BATTERY</span>
                <span class="gauge-unit">Volts</span>
            </div>
            <div class="gauge-body gauge-body-bar">
                <div class="bar-gauge-container">
                    <div id="bar-battery" class="bar-gauge-fill"></div>
                    <div class="bar-gauge-markers">
                        <span>10</span><span>12</span><span>14</span><span>16</span>
                    </div>
                </div>
                <span id="value-battery" class="gauge-value-medium bar-value">0.0</span>
            </div>
        </div>

        <!-- Throttle Position -->
        <div class="gauge-card gauge-compact" id="gauge-card-tps">
            <div class="gauge-header">
                <span class="gauge-label">TPS</span>
            </div>
            <div class="gauge-body gauge-body-compact">
                <div class="progress-ring-container">
                    <svg id="ring-tps" viewBox="0 0 100 100" class="progress-ring">
                        <circle class="progress-ring-bg" cx="50" cy="50" r="42"/>
                        <circle id="ring-tps-fill" class="progress-ring-fill" cx="50" cy="50" r="42"/>
                    </svg>
                    <span id="value-tps" class="ring-value">0%</span>
                </div>
            </div>
        </div>

        <!-- Transmission Gear -->
        <div class="gauge-card gauge-compact" id="gauge-card-gear">
            <div class="gauge-header">
                <span class="gauge-label">GEAR</span>
            </div>
            <div class="gauge-body gauge-body-compact">
                <div class="gear-display">
                    <span id="value-gear" class="gear-number">N</span>
                    <span id="value-tcc" class="tcc-status">TCC: —</span>
                </div>
            </div>
        </div>

        <!-- Fuel Learn -->
        <div class="gauge-card gauge-compact" id="gauge-card-learn">
            <div class="gauge-header">
                <span class="gauge-label">FUEL LEARN</span>
            </div>
            <div class="gauge-body gauge-body-compact">
                <span id="value-learn" class="gauge-value-medium compact-value">0.0%</span>
            </div>
        </div>

        <!-- IAT -->
        <div class="gauge-card gauge-compact" id="gauge-card-iat">
            <div class="gauge-header">
                <span class="gauge-label">IAT</span>
            </div>
            <div class="gauge-body gauge-body-compact">
                <span id="value-iat" class="gauge-value-medium compact-value">— °F</span>
            </div>
        </div>
    </main>

    <!-- Footer Stats -->
    <footer id="footer-stats">
        <span id="stat-frames">Frames: 0</span>
        <span id="stat-channels">Channels: 0</span>
        <span id="stat-errors">Errors: 0</span>
        <span id="stat-uptime">Uptime: 0s</span>
    </footer>

    <script src="/static/dashboard.js"></script>
</body>
</html>
